; =====================================================================
; GLOBAL BASE ENVIRONMENT Configuration (Shared across both profiles)
; =====================================================================
[env]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    -Wall -Wno-switch-enum
    ; strip local build-machine paths out of the compiled binary
    -ffile-prefix-map=${platformio.core_dir}=pio
    -fmacro-prefix-map=${platformio.core_dir}=pio
	
; =====================================================================
; TARGET 1: Hardware Bring-up Diagnostic Profile
; =====================================================================
[env:diag_s3]
build_flags = 
    ${env.build_flags}       ; ?? Inherits all global OPI memory and CDC serial flags
    -D DIAG_BUILD
build_src_filter = +<diag_main.cpp>

; =====================================================================
; TARGET 2: Production Knife Sharpening Application Firmware
; =====================================================================
[env:m5stack-sticks3]
build_src_filter = +<*> -<diag_main.cpp>